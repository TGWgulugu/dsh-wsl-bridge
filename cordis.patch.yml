# Bundle layer for dsh-wsl-bridge.
#
# Two rows:
#   1. `wsl-bridge`  — the host-wide bridge (wsl_* tools + routing prompt).
#   2. `preset-wsl`  — the declarative `WSL` agent preset: a session created in
#      this mode works with Linux paths (`bash`/`read`/`write`/`edit`/`grep`/
#      `glob` are the WSL variants mounted from `dsh-wsl-bridge/wsl-world`).
#
# Both are disabled outside Windows: the bridge spawns `wsl.exe` and the preset
# cannot work where WSL does not exist.
- insert:
    - id: wsl-bridge
      name: 'dsh-wsl-bridge'
      config:
        distro: ''
        timeoutMs: 120000
        promptSection: true
        selfCheck: false
      disabled: !!js process.platform !== 'win32'
    - id: preset-wsl
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wsl
        name: WSL
        description: 'Linux paths and a persistent bash inside the WSL distribution.'
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model. Your working
                directory is inside a WSL (Windows Subsystem for Linux) distribution:
                the bash, read, write, edit, grep and glob tools all take Linux paths,
                and the Windows filesystem is reachable as /mnt/<drive>. Use bash
                syntax for commands, not PowerShell.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: wsl-world
            name: 'dsh-wsl-bridge/wsl-world'
            config:
              distro: ''
              timeoutMs: 120000
              defaultWorkdir: session
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
      disabled: !!js process.platform !== 'win32'
