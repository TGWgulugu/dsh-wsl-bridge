name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (fake host only, no WSL required)
        run: npm test
